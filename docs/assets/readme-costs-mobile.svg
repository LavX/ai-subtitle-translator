<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-labelledby="title desc"><title id="title">Subtitle translation cost examples</title><desc id="desc">Luna floor route estimates: 20-minute episode $0.0068; two-hour movie $0.0410; 24 forty-minute episodes $0.3277. One target language, 15 cues per minute, no retries. September 7, 2026 benchmark extrapolation.</desc><rect width="600" height="850" rx="20" fill="#f2f3e8"/><style>text{font-family:Arial, sans-serif}.mono{font-family:Consolas,monospace}</style><text x="36" y="43" font-size="18" font-weight="700" letter-spacing="2" fill="#234d44">SMALL COSTS. MORE MOVIE NIGHTS.</text><text x="36" y="95" class="mono" font-size="17" letter-spacing="2" fill="#41564d">ONE EPISODE</text><text x="33" y="179" font-size="68" font-weight="700" letter-spacing="-4" fill="#122f26">$0.0068</text><text x="36" y="225" font-size="19" fill="#41564d">20 MIN · 300 CUES</text><path d="M36 281H564" stroke="#aab7aa" stroke-dasharray="4 8"/><text x="36" y="319" class="mono" font-size="17" letter-spacing="2" fill="#41564d">MOVIE NIGHT</text><text x="33" y="403" font-size="68" font-weight="700" letter-spacing="-4" fill="#122f26">$0.0410</text><text x="36" y="449" font-size="19" fill="#41564d">120 MIN · 1,800 CUES</text><path d="M36 505H564" stroke="#aab7aa" stroke-dasharray="4 8"/><text x="36" y="543" class="mono" font-size="17" letter-spacing="2" fill="#41564d">FULL SEASON</text><text x="33" y="627" font-size="68" font-weight="700" letter-spacing="-4" fill="#122f26">$0.3277</text><text x="36" y="673" font-size="19" fill="#41564d">24 × 40 MIN · 14,400 CUES</text><text x="36" y="790" font-size="17" fill="#41564d">LUNA :FLOOR · USD · ONE TARGET LANGUAGE</text><text x="36" y="820" font-size="15" fill="#41564d">Estimates from short tests. Retries excluded.</text></svg>