<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">AI Subtitle Translator for Bazarr+</title>
  <desc id="desc">Cinematic subtitle frames show the English line Don't look back. translated into Hungarian as Ne nézz hátra. Mint and amber timeline tracks connect the two languages.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111e2c"/>
      <stop offset="1" stop-color="#071014"/>
    </linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#293e43"/>
      <stop offset=".55" stop-color="#132329"/>
      <stop offset="1" stop-color="#091418"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#89f2ce" stop-opacity=".17"/>
      <stop offset="1" stop-color="#89f2ce" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rounded"><rect width="1280" height="560" rx="24"/></clipPath>
    <style>
      text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1280" height="560" fill="url(#backdrop)"/>
    <path d="M680 0H1280V560H1050Z" fill="#14282a" opacity=".36"/>
    <path d="M0 472H1280" stroke="#34434b"/>
    <path d="M56 48H88" stroke="#89f2ce" stroke-width="5"/>
    <text x="103" y="55" font-size="17" font-weight="700" letter-spacing="2.1" fill="#89f2ce">FOR BAZARR+</text>
    <text x="56" y="153" font-size="76" font-weight="800" letter-spacing="-3" fill="#f5f7f1">AI SUBTITLE</text>
    <text x="56" y="233" font-size="76" font-weight="800" letter-spacing="-3" fill="#f5f7f1">TRANSLATOR</text>
    <text x="59" y="294" font-size="25" fill="#c7d2d6">Keep the scene. Change the language.</text>
    <text x="59" y="349" font-size="17" fill="#a7b7be">SRT subtitles · OpenRouter models · HTTP API</text>
    <path d="M60 404H515" stroke="#42565d" stroke-width="2"/>
    <rect x="60" y="393" width="115" height="22" rx="4" fill="#89f2ce"/>
    <rect x="183" y="393" width="78" height="22" rx="4" fill="#89f2ce" opacity=".6"/>
    <rect x="269" y="393" width="144" height="22" rx="4" fill="#89f2ce" opacity=".32"/>
    <path d="M429 394L440 404L429 414" fill="none" stroke="#9eafb6" stroke-width="2"/>
    <rect x="456" y="393" width="59" height="22" rx="4" fill="#ffd08a"/>
    <g transform="translate(708 48)">
      <text x="0" y="15" class="mono" font-size="13" letter-spacing="2" fill="#a7b7be">ONE SCENE. TWO LANGUAGES.</text>
      <rect x="0" y="36" width="514" height="162" rx="10" fill="url(#scene)" stroke="#4e626a"/>
      <path d="M1 37H226L410 197H1Z" fill="url(#light)"/>
      <path d="M314 37V197M338 37V197M426 37V197" stroke="#6c8383" opacity=".17"/>
      <rect x="20" y="54" width="84" height="26" rx="4" fill="#89f2ce"/>
      <text x="62" y="72" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#10231e">ENGLISH</text>
      <rect x="86" y="132" width="342" height="44" rx="5" fill="#060d12" fill-opacity=".84"/>
      <text x="257" y="162" font-size="29" font-weight="600" text-anchor="middle" fill="#ffffff">Don't look back.</text>
      <path d="M257 207V224M250 219L257 226L264 219" fill="none" stroke="#89f2ce" stroke-width="2"/>
      <rect x="0" y="238" width="514" height="162" rx="10" fill="url(#scene)" stroke="#4e626a"/>
      <path d="M1 239H226L410 399H1Z" fill="url(#light)"/>
      <path d="M314 239V399M338 239V399M426 239V399" stroke="#6c8383" opacity=".17"/>
      <rect x="20" y="256" width="100" height="26" rx="4" fill="#ffd08a"/>
      <text x="70" y="274" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#34230b">HUNGARIAN</text>
      <rect x="86" y="334" width="342" height="44" rx="5" fill="#060d12" fill-opacity=".84"/>
      <text x="257" y="364" font-size="29" font-weight="600" text-anchor="middle" fill="#ffffff">Ne nézz hátra.</text>
    </g>
    <text x="59" y="523" class="mono" font-size="14" letter-spacing="1.4" fill="#89f2ce">SUBTITLES, WITHOUT THE LANGUAGE BARRIER.</text>
    <text x="1222" y="523" class="mono" font-size="14" text-anchor="end" fill="#a7b7be">SELF-HOSTED / OPEN SOURCE</text>
  </g>
</svg>
