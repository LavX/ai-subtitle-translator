[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-subtitle-translator"
version = "2.1.1"
description = "LLM-powered subtitle translation microservice by LavX"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "LavX"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["subtitle", "translation", "openrouter", "llm", "fastapi", "srt", "ai", "bazarr"]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "openrouter==1.1.133",
    "srt>=3.5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "import-linter>=2.15",
]

[project.urls]
Homepage = "https://github.com/LavX/ai-subtitle-translator"
Documentation = "https://github.com/LavX/ai-subtitle-translator#readme"
Repository = "https://github.com/LavX/ai-subtitle-translator"
Bazarr = "https://github.com/LavX/bazarr"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subtitle_translator = [
    "server/static/index.html", "server/static/app.css", "server/static/app.js",
    "server/static/archive.mjs", "server/static/session.mjs",
    "server/static/outfit.woff2", "server/static/outfit-OFL.txt",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "tests/battle_royale_50_lines.py",
    "tests/elimination_battle_royale.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "E501",  # line length handled by ruff format
    "N815",  # camelCase in Pydantic models (API compatibility)
    "N806",  # uppercase variable names in tests (MockBP etc)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.importlinter]
root_package = "subtitle_translator"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Package direction: server on top, then backends, then core"
type = "layers"
layers = [
    "subtitle_translator.server",
    "subtitle_translator.backends",
    "subtitle_translator.core",
]

[[tool.importlinter.contracts]]
name = "The core and the back ends never load server libraries"
type = "forbidden"
source_modules = ["subtitle_translator.core", "subtitle_translator.backends"]
forbidden_modules = ["fastapi", "starlette", "pydantic_settings", "dotenv", "cryptography", "uvicorn"]
