# AI Subtitle Translator by LavX
# https://github.com/LavX/ai-subtitle-translator

services:
  ai-subtitle-translator:
    build: .
    container_name: ai-subtitle-translator
    ports:
      - "8765:8765"
    environment:
      # OpenRouter Configuration
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-google/gemini-2.5-flash-lite}
      - OPENROUTER_TEMPERATURE=${OPENROUTER_TEMPERATURE:-0.3}
      - OPENROUTER_MAX_TOKENS=${OPENROUTER_MAX_TOKENS:-8000}
      # Back ends, tried in this order when one is rate limited, out of quota or unreachable
      # - BACKEND_ORDER=${BACKEND_ORDER:-openrouter,gemini}
      # - GEMINI_API_KEYS=${GEMINI_API_KEYS}
      # - GEMINI_KEY_PROJECTS=${GEMINI_KEY_PROJECTS}
      # - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      # - GEMINI_PRICE_INPUT=${GEMINI_PRICE_INPUT:-0}
      # - GEMINI_PRICE_OUTPUT=${GEMINI_PRICE_OUTPUT:-0}
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8765
      - UI_ENABLED=${UI_ENABLED:-false}
      # Translation Configuration
      - BATCH_SIZE=${BATCH_SIZE:-100}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_DELAY=${RETRY_DELAY:-1.0}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-120.0}
      # App identification for OpenRouter analytics
      - APP_NAME=${APP_NAME:-ai-subtitle-translator}
      - APP_URL=${APP_URL:-https://lavx.hu}
    volumes:
      - translator-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: ai-subtitle-translator-network

volumes:
  translator-data:
