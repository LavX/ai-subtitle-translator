name: Build Docker Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag (e.g., v1.1.0)"
        required: false
        default: ""
        type: string
      python_version:
        description: "Python version"
        required: true
        type: choice
        options:
          - "3.14"
          - "3.13"
          - "3.12"
        default: "3.14"
      enable_jit:
        description: "Enable Python JIT compiler"
        required: false
        type: boolean
        default: true
      platforms:
        description: "Target platforms"
        required: true
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64
        default: "linux/amd64,linux/arm64"
      push_latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lavx/ai-subtitle-translator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install and test
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine version and tags
        id: version
        run: |
          PYTHON_VER="${{ inputs.python_version || '3.14' }}"
          JIT_ENABLED="${{ inputs.enable_jit == '' && 'true' || inputs.enable_jit }}"
          JIT_SUFFIX="${{ inputs.enable_jit == 'false' && '' || '-jit' }}"
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Get version from tag or input
          if [ -n "${{ inputs.version_tag }}" ]; then
            VERSION="${{ inputs.version_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-${SHORT_SHA}"
          fi
          VERSION="${VERSION#v}"

          # Build tags
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${VERSION}"
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:py${PYTHON_VER}${JIT_SUFFIX}"

          if [ "${{ inputs.push_latest }}" == "true" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "python_version=${PYTHON_VER}" >> $GITHUB_OUTPUT
          echo "jit_enabled=${JIT_ENABLED}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Dockerfile
        run: |
          cat > Dockerfile.ci << EOF
          FROM python:${{ steps.version.outputs.python_version }}-slim

          WORKDIR /app

          ENV PYTHONDONTWRITEBYTECODE=1 \
              PYTHONUNBUFFERED=1
          EOF

          if [ "${{ steps.version.outputs.jit_enabled }}" == "true" ]; then
            echo 'ENV PYTHON_JIT=1' >> Dockerfile.ci
          fi

          cat >> Dockerfile.ci << 'EOF'

          RUN apt-get update && apt-get install -y --no-install-recommends \
              curl \
              && rm -rf /var/lib/apt/lists/*

          COPY requirements.txt .
          RUN pip install --no-cache-dir --upgrade pip && \
              pip install --no-cache-dir -r requirements.txt

          COPY pyproject.toml .
          COPY src/ ./src/
          RUN pip install --no-cache-dir -e .

          RUN useradd --create-home --shell /bin/bash appuser && \
              chown -R appuser:appuser /app
          USER appuser

          EXPOSE 8765

          HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
              CMD curl -f http://localhost:8765/health || exit 1

          CMD ["uvicorn", "subtitle_translator.main:app", "--host", "0.0.0.0", "--port", "8765"]
          EOF

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=AI Subtitle Translator
            org.opencontainers.image.description=LLM-powered subtitle translation service
            org.opencontainers.image.vendor=LavX
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=translator
          cache-to: type=gha,mode=max,scope=translator

      - name: Artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Python** | ${{ steps.version.outputs.python_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **JIT** | ${{ steps.version.outputs.jit_enabled }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
