name: Publish to PyPI

# Production PyPI is published by publishing a GitHub release, never by pushing a tag and never
# by hand. The publish job runs in the pypi GitHub environment; set a required reviewer on it
# so a person approves the upload.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Check the tag against the package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release_version.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build the sdist and wheel
        run: |
          pip install --upgrade pip build
          python -m build --outdir dist/
      - name: The wheel installs and imports without the server extra
        run: |
          python -m venv /tmp/core && /tmp/core/bin/pip install --quiet dist/*.whl
          /tmp/core/bin/python -c "import subtitle_translator.core.engine, subtitle_translator.backends.gemini, subtitle_translator.backends.openai_compatible, subtitle_translator.backends.openrouter_backend"
          if /tmp/core/bin/python -c "import fastapi" 2>/dev/null; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
