name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check the tag against the package version
        id: version
        if: github.event_name == 'push'
        run: python scripts/check_release_version.py "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Build the sdist and wheel
        run: |
          pip install --upgrade pip build
          python -m build --outdir dist/
      - name: The wheel installs and imports without the server extra
        run: |
          python -m venv /tmp/core && /tmp/core/bin/pip install --quiet dist/*.whl
          /tmp/core/bin/python -c "import subtitle_translator.core.engine, subtitle_translator.backends.gemini, subtitle_translator.backends.openai_compatible, subtitle_translator.backends.openrouter_backend"
          if /tmp/core/bin/python -c "import fastapi" 2>/dev/null; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
